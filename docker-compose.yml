services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: apexdelta
      POSTGRES_USER: apexdelta
      POSTGRES_PASSWORD: apexdelta
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 stores data in a versioned subdirectory under this path.
      - apexdelta-postgres-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexdelta -d apexdelta"]
      interval: 5s
      timeout: 5s
      retries: 10

  inngest:
    image: inngest/inngest:latest
    restart: unless-stopped
    command: ["inngest", "dev", "-u", "http://host.docker.internal:3001/api/inngest"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      INNGEST_DEV: "1"
    ports:
      - "8288:8288"
      - "8289:8289"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  apexdelta-postgres-v18:
